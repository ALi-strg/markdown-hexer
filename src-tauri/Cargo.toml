[package]
name = "markdown-editor"
version = "0.1.0"
description = "Markdown-Magic — a distraction-free native Markdown editor"
authors = ["Markdown-Magic"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "markdown_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"

# Linux-only: the Wayland CSD header bar does not follow `set_title`, so the
# titlebar widget itself is synced from `title::sync_csd_titlebar`. Pinned to
# the same gtk release tauri depends on (see Cargo.lock) so the widget types
# unify.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }


