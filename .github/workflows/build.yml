name: build

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # Ubuntu is the CI gate: it is the only platform that runs the WebDriver
  # end-to-end suite (WebKitGTK under xvfb), and it also builds the Linux
  # release bundle. Windows and macOS only build and release after this job
  # is green, so a regressed Document lifecycle never ships an installer.
  e2e:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: resolve release version from tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          printf '{"version":"%s"}' "${GITHUB_REF_NAME#v}" > .release-version.json

      - name: install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            webkit2gtk-driver

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install frontend dependencies
        run: npm ci

      - name: run frontend unit tests
        run: npm test

      - name: run rust unit tests
        working-directory: ./src-tauri
        run: cargo test

      - name: install tauri-driver
        run: cargo install tauri-driver --locked

      - name: run end-to-end tests
        env:
          # WebKitGTK software-rendering flags: no GPU on the runner, DMABUF
          # renderer can crash the webview in VMs.
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: xvfb-run -a -s "-screen 0 1280x800x24" npm run test:e2e

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseBody: "Markdown-Magic ${{ env.RELEASE_VERSION }} — see the assets to download and install."
          releaseDraft: true
          prerelease: ${{ contains(env.RELEASE_VERSION, '-') }}
          args: ${{ github.ref_type == 'tag' && '--config .release-version.json' || '' }}
          releaseAssetNamePattern: "[name]_[version]_linux-[arch][setup][ext]"

  release:
    needs: e2e
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macos
          - platform: windows-latest
            label: windows

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: resolve release version from tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          printf '{"version":"%s"}' "${GITHUB_REF_NAME#v}" > .release-version.json

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install frontend dependencies
        run: npm ci

      - name: run frontend unit tests
        run: npm test

      - name: run rust unit tests
        working-directory: ./src-tauri
        run: cargo test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseBody: "Markdown-Magic ${{ env.RELEASE_VERSION }} — see the assets to download and install."
          releaseDraft: true
          prerelease: ${{ contains(env.RELEASE_VERSION, '-') }}
          args: ${{ github.ref_type == 'tag' && '--config .release-version.json' || '' }}
          releaseAssetNamePattern: "[name]_[version]_${{ matrix.label }}-[arch][setup][ext]"

      - name: add windows arm64 rust target
        if: matrix.platform == 'windows-latest'
        run: rustup target add aarch64-pc-windows-msvc

      - name: build windows arm64 bundle
        if: matrix.platform == 'windows-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseBody: "Markdown-Magic ${{ env.RELEASE_VERSION }} — see the assets to download and install."
          releaseDraft: true
          prerelease: ${{ contains(env.RELEASE_VERSION, '-') }}
          args: ${{ github.ref_type == 'tag' && '--config .release-version.json --target aarch64-pc-windows-msvc' || '--target aarch64-pc-windows-msvc' }}
          releaseAssetNamePattern: "[name]_[version]_windows-[arch][setup][ext]"
