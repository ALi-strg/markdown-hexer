[package]
name = "markdown-hexer"
version = "2.0.0"
edition = "2024"
rust-version = "1.95"
description = "Markdown Hexer 2.0 native shell"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "markdown_hexer"
path = "src/lib.rs"

[[bin]]
name = "markdown-hexer"
path = "src/main.rs"

[dependencies]
arboard = "3"
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "wayland",
    "x11",
] }
egui = "0.37"
egui_extras = { version = "0.37", default-features = false, features = [
    "file",
    "http",
    "image",
] }
egui_commonmark = { version = "0.26", default-features = false, features = [
    "fetch",
    "load-images",
    "pulldown_cmark",
] }
image = { version = "0.25", default-features = false, features = [
    "gif",
    "jpeg",
    "png",
    "webp",
] }
interprocess = "2"
pulldown-cmark = { version = "0.13", default-features = false }
rfd = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
